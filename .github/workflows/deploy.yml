name: Build and deploy Jupyter Book
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true
jobs:
  notebook-tests:
    runs-on: ubuntu-latest
    env:
      TV5_SOURCE: ${{ github.workspace }}/_source
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: LeoTkiet/arxiv-data-science
          ref: 0f8d83b591c89cf085f344f5fb59af671ab43b81
          path: _source
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -e './_source[reporting,dev]'
      - run: python -m unittest discover -s tests -v
  build:
    runs-on: ubuntu-latest
    env:
      TV5_RUN: ${{ vars.TV5_RUN || 'demo' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - run: python -m ipykernel install --user --name python3
      - run: jupyter-book build . --all --warningiserror
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _build/html
  deploy:
    if: github.event_name != 'pull_request'
    needs: [build, notebook-tests]
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
